<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7684;--pr:#0f766e;--prt:#fff;--ok:#15803d;--bad:#b91c1c;--wr:#ca8a04;--bd:#e3e7ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--card:#19212a;--tx:#e8edf2;--mu:#93a0ae;--pr:#2dd4bf;--prt:#06231f;--ok:#4ade80;--bad:#f87171;--wr:#facc15;--bd:#2a3541;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161c;--card:#19212a;--tx:#e8edf2;--mu:#93a0ae;--pr:#2dd4bf;--prt:#06231f;--ok:#4ade80;--bad:#f87171;--wr:#facc15;--bd:#2a3541;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.6 Gandom,Vazirmatn,Tahoma,sans-serif;padding-bottom:90px}
h1{font-size:18px;margin:0;padding:14px 16px 4px}
h2{font-size:15px;margin:16px 0 8px}
main{padding:4px 14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.s,.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.s small{color:var(--mu);display:block;font-size:12px}.s b{font-size:15px}
.card{margin-bottom:8px}
.fl{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.t{font-weight:600}.m{color:var(--mu);font-size:12px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wr{color:var(--wr)}.pt{color:#ea580c}.chip.h{color:#ea580c;border-color:#ea580c}
.btn,.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
.chip{border-radius:99px;padding:2px 10px;font-size:12px;margin:3px 0 0 4px}
.chip.p{color:var(--ok);border-color:var(--ok)}.chip.u{color:var(--bad);border-color:var(--bad)}
.pri{background:var(--pr);color:var(--prt);border:0}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:2px 3px;text-align:center;font-size:12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{position:sticky;right:0;background:var(--card);padding:2px 8px;text-align:right}
td button{background:none;border:0;font:700 14px Gandom,Vazirmatn,Tahoma;cursor:pointer;width:100%;padding:2px 0;line-height:1.1}#ib{position:fixed;top:env(safe-area-inset-top,0px);left:8px;right:8px;margin-top:8px;z-index:8;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 10px;display:none;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.2)}#ib img{width:34px;height:34px;border-radius:9px}#ib .tx{flex:1;font-size:13px;line-height:1.4}.lr{font-size:12px;padding:4px 0;border-bottom:1px solid var(--bd);line-height:1.5}.lr:last-child{border-bottom:0}.stt{min-width:0;width:100%}.stt td,.stt th{padding:3px 5px;font-size:12px}.stt .sec{background:var(--bg);font-weight:600;text-align:right}.pie{display:inline-block;width:15px;height:15px;border-radius:50%;border:1.5px solid #ea580c;background:conic-gradient(#ea580c var(--p),transparent 0);vertical-align:middle}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 2px;font:600 12px Gandom,Vazirmatn,Tahoma,sans-serif;cursor:pointer}
nav button.on{color:var(--pr)}
.fab{position:fixed;left:14px;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--pr);color:var(--prt);border:0;border-radius:99px;padding:12px 20px;font:700 14px Gandom,Vazirmatn,Tahoma,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:5}
#md.on{display:flex}
#f{background:var(--card);width:100%;max-height:90%;overflow:auto;padding:16px;border-radius:16px 16px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
input,select{width:100%;margin:3px 0 10px;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto;margin:0 0 0 6px}
label{font-size:12px;color:var(--mu);display:block}
.cb{display:inline-flex;align-items:center;margin:0 0 6px 10px;color:var(--tx);font-size:13px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:10px;display:none;z-index:9;font-size:13px}
.empty{text-align:center;color:var(--mu);padding:24px 0}.dr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.dr:last-child{border-bottom:0}.dx{display:flex;align-items:center;gap:8px;white-space:nowrap}.dx b{font-size:14px}.dx .btn{padding:3px 10px}details.sc summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}details.sc summary::-webkit-details-marker{display:none}details.sc summary::after{content:'▾';color:var(--mu)}details.sc[open] summary::after{content:'▴'}details.sc[open] summary{margin-bottom:6px}details.sc label{margin-top:6px}details.sc input,details.sc select{padding:7px 9px;margin:2px 0 4px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}details.sc .g2 input,details.sc .g2 select{margin:0}details.sc .btn{padding:5px 10px}#f input,#f select{padding:7px 9px;margin:2px 0 6px;font-size:13px}#f label{font-size:11px;margin-top:2px}#f label.cb{font-size:13px}#f{padding:14px}
</style>
